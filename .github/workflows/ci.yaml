name: CI

on:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup project
              uses: ./.github/actions/setup-project

            - name: Build project
              run: npm run build

    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup project
              uses: ./.github/actions/setup-project

            - name: Run tests
              run: npm test

    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup project
              uses: ./.github/actions/setup-project

            - name: Run linter
              run: npm run lint
