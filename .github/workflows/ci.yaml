name: CI

on:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup project
              uses: ./.github/actions/setup-project

            - name: Build project
              run: npm run build

    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup project
              uses: ./.github/actions/setup-project

            - name: Run tests
              run: npm test

    check-format:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup project
              uses: ./.github/actions/setup-project

            - name: Check if all files are formatted
              run: npm run check-format
